<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Car Price Predictor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🚗 Car Price Predictor</h1>
            <p>Predict the resale value of your used car using Machine Learning</p>
        </div>

        <div class="card">

            <form id="predictionForm">

                <div class="form-grid">

                    <!-- Brand -->
                    <div class="form-group">
                        <label for="brand">Brand</label>

                        <input
                            type="text"
                            id="brand"
                            placeholder="e.g. Kia"
                            required
                        >
                    </div>


                    <!-- Model -->
                    <div class="form-group">
                        <label for="model">Model</label>

                        <input
                            type="text"
                            id="model"
                            placeholder="e.g. Seltos"
                            required
                        >
                    </div>


                    <!-- Year -->
                    <div class="form-group">
                        <label for="year">Manufacturing Year</label>

                        <input
                            type="number"
                            id="year"
                            placeholder="e.g. 2021"
                            min="1990"
                            max="2026"
                            required
                        >
                    </div>


                    <!-- Age -->
                    <div class="form-group">
                        <label for="age">Car Age</label>

                        <input
                            type="number"
                            id="age"
                            placeholder="e.g. 5"
                            min="0"
                            max="50"
                            required
                        >
                    </div>


                    <!-- KM -->
                    <div class="form-group">
                        <label for="kmDriven">Kilometers Driven</label>

                        <input
                            type="number"
                            id="kmDriven"
                            placeholder="e.g. 45000"
                            min="0"
                            required
                        >
                    </div>


                    <!-- Transmission -->
                    <div class="form-group">
                        <label for="transmission">Transmission</label>

                        <select id="transmission" required>

                            <option value="">Select Transmission</option>

                            <option value="Manual">
                                Manual
                            </option>

                            <option value="Automatic">
                                Automatic
                            </option>

                        </select>
                    </div>


                    <!-- Owner -->
                    <div class="form-group">
                        <label for="owner">Owner</label>

                        <select id="owner" required>

                            <option value="">Select Owner</option>

                            <option value="First Owner">
                                First Owner
                            </option>

                            <option value="Second Owner">
                                Second Owner
                            </option>

                            <option value="Third Owner">
                                Third Owner
                            </option>

                        </select>
                    </div>


                    <!-- Fuel -->
                    <div class="form-group">
                        <label for="fuelType">Fuel Type</label>

                        <select id="fuelType" required>

                            <option value="">Select Fuel Type</option>

                            <option value="Petrol">
                                Petrol
                            </option>

                            <option value="Diesel">
                                Diesel
                            </option>

                            <option value="CNG">
                                CNG
                            </option>

                            <option value="Electric">
                                Electric
                            </option>

                        </select>
                    </div>

                </div>


                <button type="submit" id="predictBtn">
                    Predict Car Price
                </button>

            </form>


            <!-- Loading -->
            <div id="loading" class="hidden">
                Predicting price...
            </div>


            <!-- Result -->
            <div id="result" class="result hidden">

                <p>Estimated Used Car Price</p>

                <h2 id="price">₹0</h2>

                <span id="lakhs">₹0 lakh</span>

            </div>


            <!-- Error -->
            <div id="error" class="error hidden"></div>

        </div>

        <div class="footer">
            <p>Powered by Random Forest Machine Learning</p>
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
